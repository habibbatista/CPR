<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A1B42">
<title>Portal Escolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16233D;
    --ink-soft: #45526B;
    --paper: #F8FAFD;
    --line: #DBE0E8;
    --header-dark: #0A1B42;
    --header-dark-2: #132A63;
    --blue-1: #2E6BE0;
    --blue-2: #103A9C;
    --blue-hover-1: #2559C4;
    --blue-hover-2: #0C2E80;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
  }

  body {
    background: var(--paper);
    font-family: 'Red Hat Text', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 20px;
    padding-top: calc(16px + env(safe-area-inset-top));
    padding-left: calc(20px + env(safe-area-inset-left));
    padding-right: calc(20px + env(safe-area-inset-right));
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    animation: dropIn 0.5s var(--ease) both;
  }

  .logo-btn {
    -webkit-tap-highlight-color: transparent;
    appearance: none;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    border-radius: 11px;
    transition: transform 0.25s var(--ease);
  }

  .logo-btn:active {
    transform: scale(0.9);
  }

  .logo-btn:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  .logo-btn img {
    display: block;
    width: 40px;
    height: 40px;
  }

  .school-name {
    font-family: 'Red Hat Display', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.01em;
    margin-left: 10px;
    color: var(--ink);
  }

  main {
    flex: 1;
    padding: 24px calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .actions {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .actions-label {
    font-family: 'Red Hat Text', sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
    margin: 0 0 6px;
    opacity: 0;
    animation: fadeUp 0.5s var(--ease) 0.05s both;
  }

  .account-btn {
    -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Red Hat Display', sans-serif;
    font-weight: 500;
    font-size: 16px;
    padding: 16px 20px;
    border-radius: 14px;
    border: none;
    background: #FFFFFF;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.25s var(--ease), transform 0.15s var(--ease), color 0.2s ease;
    opacity: 0;
    animation: fadeUp 0.5s var(--ease) both;
  }

  .actions .account-btn:nth-of-type(1) { animation-delay: 0.1s; }
  .actions .account-btn:nth-of-type(2) { animation-delay: 0.16s; }
  .actions .account-btn:nth-of-type(3) { animation-delay: 0.22s; }
  .actions .account-btn:nth-of-type(4) { animation-delay: 0.28s; }

  .account-btn .arrow {
    color: var(--ink-soft);
    font-size: 18px;
    transition: transform 0.25s var(--ease), color 0.2s ease;
  }

  .account-btn:focus-visible {
    outline: 2px solid var(--blue-2);
    outline-offset: 2px;
  }

  .account-btn:active {
    background: linear-gradient(180deg, var(--blue-1) 0%, var(--blue-2) 100%);
    color: #FFFFFF;
    transform: scale(0.97);
  }

  .account-btn:active .arrow {
    color: #FFFFFF;
    transform: translateX(2px);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); filter: blur(14px); }
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-8px); filter: blur(14px); }
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    header, .actions-label, .account-btn {
      animation: none !important;
      opacity: 1 !important;
      filter: none !important;
    }
    .account-btn {
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .account-btn:active {
      transform: none;
    }
  }

  @media (min-width: 640px) {
    header { padding-left: calc(32px + env(safe-area-inset-left)); padding-right: calc(32px + env(safe-area-inset-right)); }
    main { padding-left: calc(32px + env(safe-area-inset-left)); padding-right: calc(32px + env(safe-area-inset-right)); }
  }
</style>
</head>
<body ontouchstart="">

<header>
  <button class="logo-btn" type="button" aria-label="Ir a la página principal">
    <img src="images/logo.png" alt="Logo del colegio">
  </button>
  <span class="school-name">Colegio Palma Real</span>
</header>

<main>
  <div class="actions">
    <p class="actions-label">Crear una cuenta</p>
    <button class="account-btn" type="button">
      Estudiante
      <span class="arrow">›</span>
    </button>
    <button class="account-btn" type="button">
      Profesor
      <span class="arrow">›</span>
    </button>
    <button class="account-btn" type="button">
      Administrador
      <span class="arrow">›</span>
    </button>
    <button class="account-btn" type="button">
      Padre
      <span class="arrow">›</span>
    </button>
  </div>
</main>

</body>
</html>
