<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFFFF">
<title>Portal Escolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16233D;
    --ink-soft: #45526B;
    --paper: #F8FAFD;
    --line: #DBE0E8;
    --header-dark: #0A1B42;
    --header-dark-2: #132A63;
    --blue-1: #2E6BE0;
    --blue-2: #103A9C;
    --blue-hover-1: #2559C4;
    --blue-hover-2: #0C2E80;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--paper);
    font-family: 'Red Hat Text', sans-serif;
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 20px;
    padding-top: calc(16px + env(safe-area-inset-top));
    padding-left: calc(20px + env(safe-area-inset-left));
    padding-right: calc(20px + env(safe-area-inset-right));
    background: #FFFFFF;
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    animation: dropIn 0.5s var(--ease) both;
  }

  .logout-btn {
    -webkit-tap-highlight-color: transparent;
    appearance: none;
    display: none;
    position: absolute;
    right: calc(20px + env(safe-area-inset-right));
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Red Hat Display', sans-serif;
    font-weight: 500;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 10px;
    border: none;
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, transform 0.15s var(--ease);
  }

  .logout-btn:active {
    background: linear-gradient(180deg, var(--blue-1) 0%, var(--blue-2) 100%);
    color: #FFFFFF;
    transform: translateY(-50%) scale(0.95);
  }

  .logo-btn {
    -webkit-tap-highlight-color: transparent;
    appearance: none;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    border-radius: 11px;
    transition: transform 0.25s var(--ease);
  }

  .logo-btn:active {
    transform: scale(0.9);
  }

  .logo-btn:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  .logo-btn img {
    display: block;
    width: 40px;
    height: 40px;
  }

  .school-name {
    font-family: 'Red Hat Display', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.01em;
    margin-left: 10px;
    color: var(--ink);
  }

  main {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .screen {
    position: absolute;
    inset: 0;
    background: var(--paper);
    padding: 24px calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    transition: transform 0.45s var(--ease);
    transform: translateX(100%);
    z-index: 1;
  }

  .screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(8, 16, 32, 0);
    transition: background 0.45s var(--ease);
    pointer-events: none;
  }

  #screen-select {
    transform: translateX(0);
    z-index: 1;
  }

  #screen-select.pushed-back {
    transform: translateX(-30%);
  }

  #screen-select.pushed-back::after {
    background: rgba(8, 16, 32, 0.35);
  }

  #screen-email.active {
    transform: translateX(0);
    z-index: 2;
  }

  .page-title {
    font-family: 'Red Hat Display', sans-serif;
    font-weight: 800;
    font-size: 26px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-align: center;
    margin: 0;
    opacity: 0;
    animation: fadeUp 0.5s var(--ease) 0.02s both;
  }

  .back-btn {
    -webkit-tap-highlight-color: transparent;
    appearance: none;
    position: absolute;
    top: 24px;
    left: calc(20px + env(safe-area-inset-left));
    background: none;
    border: none;
    padding: 6px;
    font-family: 'Red Hat Display', sans-serif;
    font-size: 26px;
    color: var(--blue-2);
    cursor: pointer;
    transition: transform 0.15s var(--ease), opacity 0.2s ease;
  }

  .back-btn:active {
    transform: translateX(-2px) scale(0.92);
    opacity: 0.6;
  }

  .actions {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .actions-label {
    font-family: 'Red Hat Text', sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
    margin: 0 0 6px;
    opacity: 0;
    animation: fadeUp 0.5s var(--ease) 0.05s both;
  }

  .account-btn {
    -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Red Hat Display', sans-serif;
    font-weight: 500;
    font-size: 16px;
    padding: 16px 20px;
    border-radius: 14px;
    border: none;
    background: #FFFFFF;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.25s var(--ease), transform 0.15s var(--ease), color 0.2s ease;
    opacity: 0;
    animation: fadeUp 0.5s var(--ease) both;
  }

  .actions .account-btn:nth-of-type(1) { animation-delay: 0.1s; }
  .actions .account-btn:nth-of-type(2) {
    animation-name: fadeUpScale2;
    animation-delay: 0.16s;
  }
  .actions .account-btn:nth-of-type(3) {
    animation-name: fadeUpScale3;
    animation-delay: 0.22s;
  }
  .actions .account-btn:nth-of-type(4) {
    animation-name: fadeUpScale4;
    animation-delay: 0.28s;
  }

  .account-btn .arrow {
    color: var(--ink-soft);
    font-size: 18px;
    transition: transform 0.25s var(--ease), color 0.2s ease;
  }

  .account-btn:focus-visible {
    outline: 2px solid var(--blue-2);
    outline-offset: 2px;
  }

  .account-btn:active {
    background: linear-gradient(180deg, var(--blue-1) 0%, var(--blue-2) 100%);
    color: #FFFFFF;
    transform: scale(0.97);
  }

  .account-btn:active .arrow {
    color: #FFFFFF;
    transform: translateX(2px);
  }

  .email-panel {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .email-input {
    -webkit-appearance: none;
    width: 100%;
    font-family: 'Red Hat Text', sans-serif;
    font-size: 16px;
    padding: 16px 18px;
    border-radius: 14px;
    border: none;
    background: #FFFFFF;
    color: var(--ink);
    outline: none;
  }

  .email-input::placeholder {
    color: var(--ink-soft);
  }

  .domain-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .domain-btn {
    -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Red Hat Display', sans-serif;
    font-weight: 500;
    font-size: 14px;
    padding: 9px 14px;
    border-radius: 10px;
    border: none;
    background: #FFFFFF;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.2s var(--ease), color 0.2s ease, transform 0.15s var(--ease);
  }

  .domain-btn:active {
    background: linear-gradient(180deg, var(--blue-1) 0%, var(--blue-2) 100%);
    color: #FFFFFF;
    transform: scale(0.94);
  }

  .continue-btn {
    -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Red Hat Display', sans-serif;
    font-weight: 600;
    font-size: 16px;
    padding: 16px 20px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(180deg, var(--blue-1) 0%, var(--blue-2) 100%);
    color: #FFFFFF;
    cursor: pointer;
    margin-top: 6px;
    transition: transform 0.15s var(--ease), filter 0.2s ease;
  }

  .continue-btn:active {
    transform: scale(0.97);
    filter: brightness(0.92);
  }

  .form-message {
    font-family: 'Red Hat Text', sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
    margin: 0;
    min-height: 16px;
  }

  .form-message.error {
    color: #B3261E;
  }

  .text-link {
    -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent;
    background: none;
    border: none;
    font-family: 'Red Hat Text', sans-serif;
    font-size: 13px;
    color: var(--blue-2);
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
    margin: 0 auto;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); filter: blur(14px); }
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  @keyframes fadeUpScale2 {
    from { opacity: 0; transform: translateY(10px) scale(0.88); filter: blur(14px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  @keyframes fadeUpScale3 {
    from { opacity: 0; transform: translateY(10px) scale(0.8); filter: blur(14px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  @keyframes fadeUpScale4 {
    from { opacity: 0; transform: translateY(10px) scale(0.7); filter: blur(14px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-8px); filter: blur(14px); }
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    header, .actions-label, .account-btn, .page-title {
      animation: none !important;
      opacity: 1 !important;
      filter: none !important;
    }
    .account-btn, .screen {
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .account-btn:active {
      transform: none;
    }
  }

  @media (min-width: 900px) {
    header { padding-left: calc(32px + env(safe-area-inset-left)); padding-right: calc(32px + env(safe-area-inset-right)); }
    .screen { padding-left: calc(32px + env(safe-area-inset-left)); padding-right: calc(32px + env(safe-area-inset-right)); }
  }

  @media (min-width: 900px) {
    main {
      background: radial-gradient(circle at 50% 35%, #FFFFFF 0%, var(--paper) 72%);
    }

    .actions, .email-panel {
      max-width: 460px;
      background: #FFFFFF;
      padding: 40px 40px 44px;
      border-radius: 24px;
    }

    .actions-label {
      font-size: 14px;
      margin-bottom: 10px;
    }

    .page-title {
      font-size: 36px;
    }

    .account-btn {
      padding: 18px 22px;
      font-size: 17px;
    }
  }
</style>
</head>
<body ontouchstart="">

<header>
  <button class="logout-btn" id="logout-btn" type="button" onclick="cerrarSesion()">Cerrar sesión</button>
  <button class="logo-btn" type="button" aria-label="Ir a la página principal">
    <img src="images/logo.png" alt="Logo del colegio">
  </button>
  <span class="school-name">Colegio Palma Real</span>
</header>

<main>
  <div class="screen" id="screen-select">
    <h1 class="page-title">Selecciona el tipo de cuenta</h1>
    <div class="actions">
      <p class="actions-label">Crear una cuenta</p>
      <button class="account-btn" type="button" onclick="pushScreen('estudiante')">
        Estudiante
        <span class="arrow">›</span>
      </button>
      <button class="account-btn" type="button" onclick="pushScreen('profesor')">
        Profesor
        <span class="arrow">›</span>
      </button>
      <button class="account-btn" type="button" onclick="pushScreen('administrador')">
        Administrador
        <span class="arrow">›</span>
      </button>
      <button class="account-btn" type="button" onclick="pushScreen('padre')">
        Padre
        <span class="arrow">›</span>
      </button>
    </div>
  </div>

  <div class="screen" id="screen-email">
    <button class="back-btn" type="button" onclick="popScreen()" aria-label="Volver">‹</button>
    <h1 class="page-title">¿Cuál es tu correo?</h1>
    <div class="email-panel">
      <input class="email-input" id="email-input" type="email" placeholder="tu@correo.com" autocomplete="email">
      <div class="domain-row">
        <button class="domain-btn" type="button" onclick="applyDomain('@gmail.com')">@gmail</button>
        <button class="domain-btn" type="button" onclick="applyDomain('@icloud.com')">@iCloud</button>
        <button class="domain-btn" type="button" onclick="applyDomain('@hotmail.com')">@hotmail</button>
        <button class="domain-btn" type="button" onclick="applyDomain('@outlook.com')">@outlook</button>
        <button class="domain-btn" type="button" onclick="applyDomain('@yahoo.com')">@yahoo</button>
        <button class="domain-btn" type="button" onclick="applyDomain('@live.com')">@live</button>
        <button class="domain-btn" type="button" onclick="applyDomain('@proton.me')">@proton</button>
      </div>
      <input class="email-input" id="password-input" type="password" placeholder="Contraseña" autocomplete="new-password">
      <p class="form-message" id="form-message"></p>
      <button class="continue-btn" id="continue-btn" type="button" onclick="continuar()">Continuar</button>
      <button class="text-link" id="mode-toggle" type="button" onclick="toggleMode()">¿Ya tienes cuenta? Inicia sesión</button>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<script>
  // Config real de Colegio Palma Real
  const firebaseConfig = {
    apiKey: "AIzaSyCG-D90MtN300oFSX4btZ9AW-1ujNuUhw4",
    authDomain: "colegio-palma-real.firebaseapp.com",
    projectId: "colegio-palma-real",
    storageBucket: "colegio-palma-real.firebasestorage.app",
    messagingSenderId: "33695955978",
    appId: "1:33695955978:web:a5f6ba09818fbd77e7f3f3",
    measurementId: "G-GXVS4R55SG"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  if (firebase.analytics) { firebase.analytics(); }

  auth.onAuthStateChanged(function (user) {
    var logoutBtn = document.getElementById('logout-btn');
    logoutBtn.style.display = user ? 'inline-flex' : 'none';
  });

  function cerrarSesion() {
    auth.signOut();
  }

  var selectedRole = null;
  var authMode = 'signup';

  function pushScreen(role) {
    selectedRole = role;
    document.getElementById('screen-select').classList.add('pushed-back');
    document.getElementById('screen-email').classList.add('active');
  }

  function popScreen() {
    document.getElementById('screen-select').classList.remove('pushed-back');
    document.getElementById('screen-email').classList.remove('active');
    document.getElementById('email-input').value = '';
    document.getElementById('password-input').value = '';
    setMessage('');
  }

  function applyDomain(domain) {
    var input = document.getElementById('email-input');
    var current = input.value.split('@')[0];
    input.value = current + domain;
    input.focus();
  }

  function toggleMode() {
    authMode = authMode === 'signup' ? 'login' : 'signup';
    var continueBtn = document.getElementById('continue-btn');
    var toggleBtn = document.getElementById('mode-toggle');
    if (authMode === 'login') {
      continueBtn.textContent = 'Iniciar sesión';
      toggleBtn.textContent = '¿No tienes cuenta? Créala aquí';
    } else {
      continueBtn.textContent = 'Continuar';
      toggleBtn.textContent = '¿Ya tienes cuenta? Inicia sesión';
    }
    setMessage('');
  }

  function setMessage(text, isError) {
    var msg = document.getElementById('form-message');
    msg.textContent = text || '';
    msg.classList.toggle('error', !!isError);
  }

  function continuar() {
    var email = document.getElementById('email-input').value.trim();
    var password = document.getElementById('password-input').value;

    if (!email || !password) {
      setMessage('Ingresa tu correo y contraseña.', true);
      return;
    }

    if (authMode === 'signup') {
      if (!selectedRole) {
        setMessage('Selecciona primero un tipo de cuenta.', true);
        return;
      }
      auth.createUserWithEmailAndPassword(email, password)
        .then(function (cred) {
          return db.collection('users').doc(cred.user.uid).set({
            email: email,
            role: selectedRole,
            status: 'pending',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        })
        .then(function () {
          setMessage('Cuenta creada. Un administrador debe aprobarla antes de que puedas entrar.', false);
        })
        .catch(function (error) {
          setMessage(error.message, true);
        });
    } else {
      auth.signInWithEmailAndPassword(email, password)
        .catch(function (error) {
          setMessage(error.message, true);
        });
    }
  }
</script>

</body>
</html>
